<header class="nav-bar">
  <nav class="nav-list" aria-label="Navigation principale">
    @for (link of links; track link.path) {
      <a
        class="nav-pill tap"
        [routerLink]="link.path"
        routerLinkActive="nav-pill--active"
        ariaCurrentWhenActive="page"
      >
        <svg class="nav-pill__icon" viewBox="0 0 512 512" width="22" height="22" aria-hidden="true" focusable="false">
          <path fill="currentColor" [attr.d]="link.icon"></path>
        </svg>
        <span class="nav-pill__label">{{ link.label }}</span>
        <span class="nav-pill__label nav-pill__label--short">{{ link.shortLabel }}</span>
      </a>
    }
  </nav>

    <div class="nav-tools">
    <a class="nav-coins tap" routerLink="/case-shop">
      <span class="sr-only">Solde : </span>
      <span>{{ coinsLabel() }}</span>
      <span class="sr-only">, ouvrir la boutique</span>
    </a>
  </div>
</header>
