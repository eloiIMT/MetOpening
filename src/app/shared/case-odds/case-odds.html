@let o = odds();
<p class="odds__title">{{ t('cases.oddsTitle', { count: artworksPerCase }) }}</p>
<ul class="odds">
  <li class="odds__item">
    <span class="dot dot--common" aria-hidden="true"></span>
    {{ t('cases.oddsCommon', { percent: o.common }) }}
  </li>
  <li class="odds__item">
    <span class="dot dot--uncommon" aria-hidden="true"></span>
    {{ t('cases.oddsUncommon', { percent: o.uncommon }) }}
  </li>
  <li class="odds__item odds__item--top">
    <span class="odds__dots" aria-hidden="true">
      <span class="dot dot--rare"></span>
      <span class="dot dot--epic"></span>
      <span class="dot dot--legendary"></span>
    </span>
    <span>
      {{ t('cases.oddsTop', { top: o.top, rare: o.rare, epic: o.epic, legendary: o.legendary }) }}
    </span>
  </li>
</ul>
